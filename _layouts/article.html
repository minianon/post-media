<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.subtitle | escape }}">
<meta name="author" content="Tushar Bhardwaj">
<meta property="og:title" content="{{ page.title | escape }}">
<meta property="og:description" content="{{ page.subtitle | escape }}">
{% if page.cover %}<meta property="og:image" content="{{ page.cover }}">{% endif %}
<meta property="og:type" content="article">
<link rel="canonical" href="https://minianon.github.io/post-media{{ page.url }}">
<style>
  :root { --fg:#1f2328; --muted:#57606a; --link:#0969da; --bg:#fff; --code:#f6f8fa; }
  body { margin:0; background:var(--bg); color:var(--fg); font:18px/1.7 Georgia, "Times New Roman", serif; }
  main { max-width:720px; margin:0 auto; padding:48px 20px 80px; }
  h1 { font:700 40px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; margin:0 0 12px; }
  .subtitle { font:400 22px/1.4 system-ui, sans-serif; color:var(--muted); margin:0 0 24px; }
  .byline { font:14px system-ui, sans-serif; color:var(--muted); margin-bottom:32px; }
  h2 { font:700 28px/1.3 system-ui, sans-serif; margin:44px 0 12px; }
  h3 { font:700 22px/1.3 system-ui, sans-serif; margin:32px 0 8px; }
  a { color:var(--link); }
  img { max-width:100%; height:auto; display:block; margin:28px auto 8px; border-radius:8px; }
  figure { margin:0; } figcaption, img + em { display:block; text-align:center; font:14px system-ui, sans-serif; color:var(--muted); }
  blockquote { border-left:3px solid var(--fg); margin:24px 0; padding:0 20px; font-style:italic; }
  pre, code { background:var(--code); font:15px/1.5 ui-monospace, Menlo, monospace; border-radius:6px; }
  pre { padding:16px; overflow:auto; } code { padding:2px 5px; } pre code { padding:0; }
  hr { border:0; text-align:center; margin:40px 0; } hr:after { content:"· · ·"; color:var(--muted); letter-spacing:8px; }
</style>
</head>
<body>
<main>
<article>
<h1>{{ page.title }}</h1>
{% if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
<p class="byline">Tushar Bhardwaj · <a href="https://www.minianon.in/">minianon.in</a> · <a href="https://x.com/minianondev">@minianondev</a></p>
{% if page.cover %}<img src="{{ page.cover }}" alt="{{ page.title | escape }}">{% endif %}
{{ content }}
</article>
</main>
</body>
</html>
