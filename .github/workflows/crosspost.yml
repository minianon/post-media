name: Cross-post articles (Dev.to + Hashnode)

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (1 = don't post)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: crosspost
  cancel-in-progress: false

jobs:
  crosspost:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cross-post due articles
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: node .github/scripts/crosspost.mjs
      - name: Save results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add articles/*/posted.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "crosspost: record results" && git pull --rebase -q && git push)
